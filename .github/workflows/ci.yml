name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Toolchain
        shell: pwsh
        run: |
          bun --version
          cmake --version
          ninja --version
          g++ --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full suite (contract, typecheck, sdk, MSVC native, QuickJS bundle)
        run: bun run test

      - name: AddressSanitizer suite
        run: bun run test:asan

      - name: Doctor
        run: bun run doctor
